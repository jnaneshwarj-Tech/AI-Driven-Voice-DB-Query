<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <title>Student Database ERP · Government Engineering College, Mosalehosahalli</title>
    <script>
      /* Apply the stored theme before first paint so a dark-mode user never
         sees a white flash. Mirrors ThemeContext: key 'theme', values
         'light' | 'dark' | 'system'. It only touches <html class="dark">,
         which ThemeContext then takes over. */
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* private mode / disabled storage */ }
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
